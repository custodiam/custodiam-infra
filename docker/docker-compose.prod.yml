# docker/docker-compose.prod.yml
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile tunnel up -d
#
# Override del modo prod sobre el base. Endurece Keycloak y la API.
# cloudflared NO se redefine aquí: vive en el base con `profiles: [tunnel]`
# y se levanta vía `--profile tunnel`, igual que en modo tunnel staging.

services:
  keycloak:
    environment:
      # URL pública COMPLETA (con esquema). Hace que Keycloak use https y el
      # hostname público en TODAS las URLs de frontend —incluidos los enlaces
      # de los emails transaccionales (set-password, verify-email, reset)—
      # aunque el email se dispare por la red interna (http://keycloak:8080)
      # sin cabeceras x-forwarded-proto. Con solo el hostname (base
      # `auth.${DOMAIN}`), el esquema se infería de la petición y los enlaces
      # de email salían como `http://auth.${DOMAIN}:8080` (rotos).
      KC_HOSTNAME: https://auth.${DOMAIN:-localhost}
      KC_HOSTNAME_STRICT: "true"

  api:
    environment:
      DEBUG: "false"
      # Firebase Cloud Messaging (canal principal de notificaciones). La
      # credencial se descifra de docker/secrets/fcm-service-account.sops.json
      # a un fichero en claro (gitignored) antes del `up`
      # (prod-up.sh -> decrypt_fcm_secret) y se monta de solo lectura abajo.
      # FCM_PROJECT_ID se redunda (también va dentro del JSON).
      FCM_SERVICE_ACCOUNT_JSON_PATH: /run/secrets/fcm-sa.json
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-custodiam}
    volumes:
      - ./secrets/fcm-service-account.json:/run/secrets/fcm-sa.json:ro
