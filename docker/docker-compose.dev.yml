# docker/docker-compose.dev.yml
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # Exponer puertos localmente
  postgres:
    ports:
      - "5432:5432"

  keycloak:
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      # In dev without the Cloudflare Tunnel, Keycloak is reached from
      # the device/host as http://localhost:8080 (via adb reverse for
      # Android USB devices). Overriding KC_HOSTNAME here makes
      # Keycloak generate every absolute URL (form actions, redirects,
      # cookies, etc.) against localhost so the browser does not get
      # bounced to auth.custodiam.es:8080 and lose its session cookie.
      #
      # When running with the tunnel (--profile tunnel + base compose
      # without this override), the base value auth.${DOMAIN} stays in
      # effect and Keycloak emits URLs that match the public hostname
      # served by Cloudflare. See guía 10 §2.6.
      KC_HOSTNAME: "http://localhost:8080"

  ntfy:
    ports:
      - "8090:80"

  # API: build local en vez de imagen GHCR
  api:
    build:
      context: ../../custodiam-api
      dockerfile: Dockerfile
    image: custodiam-api:dev
    ports:
      - "8000:8000"
    volumes:
      - ../../custodiam-api/app:/app/app:ro  # Hot reload (solo lectura)
    environment:
      DEBUG: "true"
      # En dev local el Pixel/emulador habla a Keycloak vía adb reverse
      # a localhost:8080, y Keycloak emite tokens con
      # iss=http://localhost:8080/realms/custodiam (ver override
      # KC_HOSTNAME del servicio keycloak más arriba). El backend valida
      # `iss` contra keycloak_public_url; sin este override hereda
      # `https://auth.${DOMAIN}` del compose base — `auth.custodiam.es`
      # con el .env.sops del equipo — y rechaza con 401 cualquier
      # llamada autenticada en dev. Override simétrico al de Keycloak
      # para mantener el contrato issuer ↔ validator coherente.
      KEYCLOAK_PUBLIC_URL: "http://localhost:8080"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Web: build local en vez de imagen GHCR
  web:
    build:
      context: ../../custodiam-app
      dockerfile: Dockerfile
    image: custodiam-app:dev
    ports:
      - "3000:80"
